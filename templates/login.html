<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner Login</title>
    <link rel="stylesheet" href="..\static\css\styles.css">
    <style>
        .login-container {width: 560px;}
    </style>
</head>
<body>  
    <div class="login-container">
        <div class="login-box">
            <h1 class="title">Welcome to Trip Planner</h1>
            <p class="subtitle">Plan your perfect trip</p>
            <form action="#" method="post">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-button"><a href="http://127.0.0.1:5500/index.html">Login</a></button>
            </form>
            <div class="links">
                <a href="#">Forgot Password?</a>
                <a href="http://127.0.0.1:5500/sign.html">Sign Up</a>
            </div>
        </div>
        <!-- <div class="background-image"></div> -->
    </div>
</body>
</html>
